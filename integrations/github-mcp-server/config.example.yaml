# GitHub Copilot MCP Server Configuration Template
# Woofy McWoofson Repository - Enterprise Secure Setup
#
# Owner: KiloCoder
# Security Level: ENTERPRISE SECURE
# Last Updated: 2025-09-08

# GitHub App Configuration
github:
  app:
    id: "${GITHUB_APP_ID}"
    privateKey: "${GITHUB_APP_PRIVATE_KEY}"
    clientId: "${GITHUB_APP_CLIENT_ID}"
    clientSecret: "${GITHUB_APP_CLIENT_SECRET}"

  # Repository Configuration
  repository:
    owner: "woofy-mcwoofson"  # Replace with actual org/repo
    name: "woofy-mcwoofson"
    branch: "main"

  # Webhook Configuration
  webhook:
    secret: "${GITHUB_WEBHOOK_SECRET}"
    path: "/webhook"
    port: 8080

# MCP Server Configuration
mcp:
  server:
    host: "0.0.0.0"
    port: 8080
    secret: "${MCP_SERVER_SECRET}"

  # Security Settings
  security:
    enableAuditLogging: true
    enableRateLimiting: true
    maxRequestsPerMinute: 60
    enableCors: false
    allowedOrigins: []

  # Context Providers
  context:
    providers:
      - name: "github-issues"
        type: "github"
        enabled: true
        config:
          includeLabels: ["bug", "enhancement", "security"]
          excludeLabels: ["wontfix", "duplicate"]

      - name: "github-prs"
        type: "github"
        enabled: true
        config:
          includeStates: ["open", "closed"]
          maxItems: 50

      - name: "github-commits"
        type: "github"
        enabled: true
        config:
          maxItems: 100
          includeMerges: false

# External API Integrations (via MCP server)
integrations:
  discord:
    enabled: true
    token: "${DISCORD_TOKEN}"
    channels:
      - id: "security-alerts"
        name: "#security-alerts"

  stripe:
    enabled: true
    secretKey: "${STRIPE_SECRET_KEY}"
    webhookSecret: "${STRIPE_WEBHOOK_SECRET}"

  gmail:
    enabled: true
    clientId: "${GMAIL_CLIENT_ID}"
    clientSecret: "${GMAIL_CLIENT_SECRET}"
    redirectUri: "${GMAIL_REDIRECT_URI}"

# Monitoring & Logging
monitoring:
  enabled: true
  logLevel: "INFO"
  logFile: "mcp_server.log"

  # Security Monitoring
  security:
    enableAnomalyDetection: true
    enableRateLimitAlerts: true
    alertThresholds:
      rateLimitHits: 10
      failedRequests: 5
      securityViolations: 3

  # Health Checks
  health:
    enableHealthEndpoint: true
    healthCheckInterval: 30  # seconds
    enableMetrics: true

# Database Configuration (if needed)
database:
  enabled: false
  type: "sqlite"
  path: "mcp_server.db"

# Cache Configuration
cache:
  enabled: true
  type: "memory"
  ttl: 3600  # 1 hour
  maxSize: 1000

# Development Settings
development:
  debug: false
  enableSwagger: false
  enableGraphqlPlayground: false

# Production Overrides
production:
  logLevel: "WARNING"
  enableMetrics: true
  enableHealthEndpoint: false  # Security hardening