# 🐕‍🦺 WOOFY McWOOFSON GitHub Orchestrator Configuration
# Enterprise Infrastructure Orchestration Setup

version: "1.0"
project: woofy-mcwoofson
environment: enterprise

# Global Configuration
global:
  region: us-east-1
  availability_zones: ["us-east-1a", "us-east-1b", "us-east-1c"]
  log_level: INFO
  monitoring_enabled: true
  security_enabled: true
  backup_enabled: true

# Service Discovery Configuration
service_discovery:
  provider: aws
  namespace: woofy.local
  health_check_interval: 30s
  deregistration_delay: 30s

# Load Balancing Configuration
load_balancing:
  provider: aws
  algorithm: least_connections
  health_checks:
    interval: 30s
    timeout: 5s
    unhealthy_threshold: 2
    healthy_threshold: 2

# Monitoring Configuration
monitoring:
  provider: cloudwatch
  metrics:
    - cpu_utilization
    - memory_utilization
    - network_in
    - network_out
    - request_count
    - error_rate
  alerts:
    high_cpu:
      threshold: 80
      period: 300
      statistic: Average
    high_memory:
      threshold: 85
      period: 300
      statistic: Average
    high_error_rate:
      threshold: 5
      period: 300
      statistic: Average

# Security Configuration
security:
  encryption:
    provider: kms
    key_rotation: true
  secrets:
    provider: aws-secrets-manager
    rotation: true
  network:
    vpc_id: ${aws.vpc.id}
    security_groups:
      - woofy-api-sg
      - woofy-db-sg
  compliance:
    soc2_enabled: true
    gdpr_enabled: true
    encryption_at_rest: true
    encryption_in_transit: true

# Deployment Configuration
deployment:
  strategy: rolling
  max_unavailable: 25%
  max_surge: 25%
  timeout: 600s
  rollback_on_failure: true
  health_check_grace_period: 60s

# Auto-scaling Configuration
auto_scaling:
  enabled: true
  min_replicas: 2
  max_replicas: 10
  target_cpu_utilization: 70
  target_memory_utilization: 80
  scale_in_cooldown: 300
  scale_out_cooldown: 60

# Backup Configuration
backup:
  enabled: true
  schedule: "0 2 * * *"
  retention_days: 30
  encrypted: true
  multi_region: true

# Service Mesh Configuration
service_mesh:
  provider: aws-app-mesh
  enabled: true
  tracing:
    provider: xray
    sampling_rate: 10
  metrics:
    provider: cloudwatch
    granularity: 60s

# CI/CD Integration
cicd:
  provider: github-actions
  repository: Bakery-street-projct/Woofy-McwoofSON
  branch: final-launch
  triggers:
    - push
    - pull_request
    - tag
  environments:
    - staging
    - production

# Cost Optimization
cost_optimization:
  enabled: true
  reserved_instances: true
  spot_instances: false
  auto_shutdown:
    enabled: true
    schedule: "0 18 * * 1-5"
    timezone: Europe/Berlin

# Disaster Recovery
disaster_recovery:
  enabled: true
  backup_region: eu-west-1
  rto: 300
  rpo: 60
  failover_strategy: automatic
  test_frequency: weekly

# Compliance & Audit
compliance:
  enabled: true
  audit_logs:
    enabled: true
    retention_days: 2555
    encrypted: true
  access_logs:
    enabled: true
    retention_days: 365
    format: json
  change_management:
    enabled: true
    approval_required: true
    audit_trail: true

# Performance Optimization
performance:
  caching:
    enabled: true
    provider: redis
    ttl: 3600
  compression:
    enabled: true
    algorithm: gzip
  cdn:
    enabled: true
    provider: cloudfront
    price_class: PriceClass_100

# Integration Endpoints
integrations:
  ai_services:
    perplexity:
      endpoint: ${secrets.perplexity.endpoint}
      timeout: 30s
      retries: 3
    openrouter:
      endpoint: ${secrets.openrouter.endpoint}
      timeout: 60s
      retries: 3
    gemini:
      endpoint: ${secrets.gemini.endpoint}
      timeout: 30s
      retries: 3

  security_services:
    hallucination_mitigator:
      endpoint: ${aws.api-gateway.hallucination}
      timeout: 10s
      retries: 2
    credential_rotator:
      endpoint: ${aws.lambda.credential-rotator}
      timeout: 30s
      retries: 1

  monitoring_services:
    cloudwatch:
      namespace: WOOFY/McWoofSON
      retention_days: 90
    sns:
      topic: ${aws.sns.alerts}
      email_subscriptions:
        - security@woofymcwoofson.com
        - alerts@woofymcwoofson.com

# Environment-specific overrides
environments:
  staging:
    auto_scaling:
      min_replicas: 1
      max_replicas: 3
    monitoring:
      alerts:
        high_cpu:
          threshold: 90
        high_memory:
          threshold: 90

  production:
    auto_scaling:
      min_replicas: 3
      max_replicas: 20
    monitoring:
      alerts:
        high_cpu:
          threshold: 75
        high_memory:
          threshold: 80
    backup:
      retention_days: 90
      multi_region: true

# Service-specific configurations
services:
  woofy-api-gateway:
    type: api-gateway
    image: woofy/api-gateway:latest
    ports:
      - "443:8443"
    environment:
      NODE_ENV: production
      API_KEY: ${secrets.api_key}
    health_check:
      path: /health
      interval: 30s
      timeout: 10s
    scaling:
      min_replicas: 2
      max_replicas: 10
      target_cpu: 70
    dependencies:
      - woofy-auth-service
      - woofy-security-layer

  woofy-ai-pipeline:
    type: ai-processing
    image: woofy/ai-pipeline:latest
    environment:
      PERPLEXITY_API_KEY: ${secrets.perplexity_key}
      OPENROUTER_API_KEY: ${secrets.openrouter_key}
      GEMINI_API_KEY: ${secrets.gemini_key}
    resources:
      cpu: 1000m
      memory: 2Gi
    scaling:
      min_replicas: 1
      max_replicas: 5
      target_cpu: 75
    dependencies:
      - woofy-security-layer
      - woofy-hallucination-mitigator

  woofy-hallucination-mitigator:
    type: security
    image: woofy/hallucination-mitigator:latest
    ports:
      - "8080:8080"
    environment:
      AWS_REGION: ${aws.region}
      DYNAMODB_TABLE: ${aws.dynamodb.hallucination-tracking}
      SNS_TOPIC: ${aws.sns.hallucination-alerts}
    health_check:
      path: /health
      interval: 30s
      timeout: 10s
    security_context:
      run_as_user: 1000
      run_as_group: 1000
      read_only_root_filesystem: true
    scaling:
      min_replicas: 1
      max_replicas: 3
      target_cpu: 60

  woofy-monitoring:
    type: monitoring
    image: woofy/monitoring:latest
    ports:
      - "9090:9090"  # Prometheus
      - "3000:3000"  # Grafana
    volumes:
      - prometheus-data:/prometheus
      - grafana-data:/var/lib/grafana
    environment:
      PROMETHEUS_CONFIG: ${config.prometheus}
      GRAFANA_CONFIG: ${config.grafana}
    scaling:
      min_replicas: 1
      max_replicas: 1

# Custom metrics and alerts
custom_metrics:
  hallucination_rate:
    type: gauge
    description: "Rate of hallucination detection per minute"
    query: "rate(hallucination_detected_total[5m])"

  ai_response_accuracy:
    type: histogram
    description: "AI response accuracy distribution"
    buckets: [0.5, 0.7, 0.8, 0.9, 0.95, 0.99]

  security_violation_rate:
    type: counter
    description: "Rate of security violations detected"
    labels: ["severity", "service", "type"]

custom_alerts:
  high_hallucination_rate:
    condition: "hallucination_rate > 0.1"
    severity: critical
    description: "High hallucination detection rate detected"
    channels: [email, slack, pager]

  ai_accuracy_drop:
    condition: "ai_response_accuracy < 0.8"
    severity: warning
    description: "AI response accuracy dropping below threshold"
    channels: [email, dashboard]

  security_incident:
    condition: "security_violation_rate > 0"
    severity: critical
    description: "Security violation detected"
    channels: [email, slack, pager, sms]

# Notification channels
notification_channels:
  email:
    enabled: true
    recipients:
      - security@woofymcwoofson.com
      - alerts@woofymcwoofson.com
    template: security_alert.html

  slack:
    enabled: true
    webhook_url: ${secrets.slack.webhook}
    channel: "#woofy-alerts"
    template: slack_alert.json

  pager:
    enabled: true
    service: pagerduty
    integration_key: ${secrets.pagerduty.key}
    escalation_policy: woofy-critical

  sms:
    enabled: false
    provider: twilio
    phone_numbers:
      - "+1234567890"

# Maintenance windows
maintenance:
  enabled: true
  schedule: "0 2 * * 0"  # Every Sunday at 2 AM
  duration: 4h
  timezone: Europe/Berlin
  auto_approval: false
  notification:
    channels: [email, slack]
    advance_notice: 24h

# Emergency procedures
emergency:
  enabled: true
  auto_failover: true
  backup_region: eu-west-1
  emergency_contacts:
    - name: "Security Team"
      email: security@woofymcwoofson.com
      phone: "+1234567890"
    - name: "DevOps Team"
      email: devops@woofymcwoofson.com
      phone: "+1234567891"
  escalation_matrix:
    level1: 5m
    level2: 15m
    level3: 30m

# Final validation
validation:
  enabled: true
  pre_deployment_checks:
    - security_scan
    - dependency_check
    - configuration_validation
    - health_check
  post_deployment_checks:
    - service_health
    - integration_test
    - performance_test
    - security_audit

# Documentation and metadata
metadata:
  created_by: KiloCode
  created_date: "2025-09-08"
  last_updated: "2025-09-08"
  version: "1.0"
  documentation:
    architecture: "docs/architecture/orchestrator.md"
    api_reference: "docs/api/orchestrator-api.md"
    troubleshooting: "docs/troubleshooting/orchestrator.md"
  contacts:
    technical: infrastructure@woofymcwoofson.com
    security: security@woofymcwoofson.com
    business: business@woofymcwoofson.com