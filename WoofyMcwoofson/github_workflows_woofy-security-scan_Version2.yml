name: "Woofy: Security Sniff"
on:
  push:
    branches: [main]
  pull_request:

jobs:
  security-sniff:
    runs-on: ubuntu-latest
    steps:
      - name: 🐶 Checkout code
        uses: actions/checkout@v4
      - name: 🐶 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 🐶 Install detect-secrets
        run: pip install detect-secrets
      - name: 🐶 Scan for hardcoded secrets (Sniff!)
        run: detect-secrets scan --all-files > woofy_detect_secrets_report.txt
      - name: 🐶 Upload report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: woofy_detect_secrets_report.txt