name: "Woofy: Lint and Test"
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: 🐶 Checkout code
        uses: actions/checkout@v4
      - name: 🐶 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 🐶 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 🐶 Run linting
        run: |
          flake8 integrations/ tests/
      - name: 🐶 Run tests
        run: |
          pytest tests/ --disable-warnings -q

  security:
    runs-on: ubuntu-latest
    steps:
      - name: 🐶 Checkout code
        uses: actions/checkout@v4
      - name: 🐶 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 🐶 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 🐶 Run security tests
        run: |
          pytest tests/test_security.py --disable-warnings -q