name: Woofy Lint & Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🐾 Checkout
        uses: actions/checkout@v4
      - name: 🐾 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 🐾 Install deps
        run: |
          pip install -r requirements.txt || true
          pip install pytest flake8
      - name: 🐾 Lint
        run: flake8 .
      - name: 🐾 Tests
        run: pytest -q