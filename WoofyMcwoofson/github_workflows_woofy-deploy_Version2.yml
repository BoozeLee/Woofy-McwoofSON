name: "Woofy: Deploy MCP Server"

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🐾 Checkout code
        uses: actions/checkout@v3
      - name: 🐾 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: 🐾 Install dependencies
        run: npm install
      - name: 🐾 Lint & Test
        run: |
          npm run lint
          npm test
      - name: 🐾 Deploy to Production
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          npm run build
          npm run deploy