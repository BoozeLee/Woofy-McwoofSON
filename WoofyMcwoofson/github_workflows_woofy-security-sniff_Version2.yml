name: Woofy Security Sniff

on:
  pull_request:
  workflow_dispatch:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: 🐶 Checkout
        uses: actions/checkout@v4
      - name: 🐶 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 🐶 Install detect-secrets
        run: pip install detect-secrets
      - name: 🐶 Scan
        run: detect-secrets scan --all-files > woofy_detect_secrets_report.txt
      - name: 🐶 Artifact upload
        uses: actions/upload-artifact@v4
        with:
          name: woofy-secret-scan
          path: woofy_detect_secrets_report.txt