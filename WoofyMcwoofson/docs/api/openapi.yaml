openapi: 3.1.0
info:
  title: Woofy McWoofson API
  version: '1.0.0'
  description: |
    🐶 The Woofy McWoofson API provides endpoints for interacting with the Woofy application.
    All endpoints require authentication and comply with project security standards.
    Maintained by BoozeLee, 2025-09-08
servers:
  - url: https://api.bakerystreet.example.com/v1
paths:
  /woof:
    get:
      summary: Dog-themed health check
      description: Returns a friendly woof if the API is running.
      responses:
        '200':
          description: Woof response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Woof! 🐾 The API is live."
  /automation/run:
    post:
      summary: Trigger an automation workflow
      operationId: runAutomation
      tags: [automation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workflow, params]
              properties:
                workflow:
                  type: string
                  example: "google-drive-backup"
                params:
                  type: object
                  additionalProperties: true
      responses:
        '202':
          description: Automation started
          content:
            application/json:
              schema:
                type: object
                properties:
                  runId:
                    type: string
                  status:
                    type: string
                    example: "pending"
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
  /audit/logs:
    get:
      summary: Fetch audit logs (admin only)
      security:
        - ApiKeyAuth: []
      parameters:
        - in: query
          name: since
          schema:
            type: string
            format: date-time
          required: false
          description: Return logs since this time
      responses:
        '200':
          description: Audit logs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    timestamp:
                      type: string
                      format: date-time
                    event:
                      type: string
                    user:
                      type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
security:
  - ApiKeyAuth: []