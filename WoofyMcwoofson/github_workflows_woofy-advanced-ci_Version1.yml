name: "Woofy: Advanced CI/CD"

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

jobs:
  build-and-test:
    name: "Build & Test"
    runs-on: ubuntu-latest
    steps:
      - name: 🐾 Checkout
        uses: actions/checkout@v4
      - name: 🐾 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: reports/

  compliance:
    name: "Compliance & Secrets Scan"
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install detect-secrets
        run: pip install detect-secrets
      - name: Scan for secrets
        run: detect-secrets scan --all-files > compliance_report.txt
      - name: Upload compliance report
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report
          path: compliance_report.txt

  notify:
    name: "Notify Success"
    runs-on: ubuntu-latest
    needs: [build-and-test, compliance]
    if: ${{ success() }}
    steps:
      - name: Notify on Slack (stub)
        run: echo "CI/CD pipeline succeeded! 🐕"