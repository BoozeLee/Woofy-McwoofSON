AWSTemplateFormatVersion: '2010-09-09'
Description: 'Simple WOOFY Hallucination Mitigation System'

Resources:
  # DynamoDB Table
  HallucinationTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: 'woofy-hallucination-tracking'
      AttributeDefinitions:
        - AttributeName: 'request_id'
          AttributeType: 'S'
      KeySchema:
        - AttributeName: 'request_id'
          KeyType: 'HASH'
      BillingMode: 'PAY_PER_REQUEST'

  # SNS Topic
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: 'woofy-alerts'

  # Lambda Role
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: HallucinationPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - sns:Publish
                Resource:
                  - !GetAtt HallucinationTable.Arn
                  - !Ref AlertTopic

  # Lambda Function
  DetectionFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: 'woofy-hallucination-detector'
      Runtime: 'python3.11'
      Handler: 'index.handler'
      Role: !GetAtt LambdaRole.Arn
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          
          def handler(event, context):
              return {
                  'statusCode': 200,
                  'body': json.dumps({'message': 'Hallucination detector ready'})
              }

Outputs:
  TableName:
    Value: !Ref HallucinationTable
  TopicArn:
    Value: !Ref AlertTopic
  FunctionName:
    Value: !Ref DetectionFunction