name: "Woofy: Compliance Check"
on:
  pull_request:

jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 🐾 Install tools
        run: pip install bandit
      - name: 🐾 Security scan (bandit)
        run: bandit -r integrations main.py -ll -q
