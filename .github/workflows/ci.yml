name: CI — Woofy-McwoofSON

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check integrations main.py tests scripts || true
      - name: Security scan (bandit)
        run: bandit -r integrations main.py -ll -q
      - name: Tests (pytest)
        run: pytest --tb=short
