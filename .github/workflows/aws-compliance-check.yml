name: WOOFY AWS Compliance Check

on:
  push:
    branches: [ main, final-launch ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6 AM

jobs:
  aws-compliance:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: 3.9
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install boto3 pytest moto
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
    
    - name: Run AWS compliance tests
      run: |
        python -m pytest tests/test_aws_compliance.py -v --tb=short
    
    - name: Generate compliance report
      run: |
        python aws_integration.py > compliance_report.txt
        echo "## WOOFY Compliance Report" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        cat compliance_report.txt >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
    
    - name: Security scan
      run: |
        echo "🔍 Running security scan..."
        python -c "
        import boto3
        import json
        from aws_integration import WoofyAWSIntegration
        
        woofy = WoofyAWSIntegration()
        report = woofy.generate_compliance_report()
        
        if report['status'] == 'COMPLIANT':
            print('✅ Security scan passed')
            exit(0)
        else:
            print('❌ Security scan failed')
            exit(1)
        "
    
    - name: Upload compliance artifacts
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: compliance-report
        path: compliance_report.txt