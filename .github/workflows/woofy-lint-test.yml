name: "Woofy: Lint & Test 🐶"
on:
  pull_request:
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: 🐶 Checkout code
        uses: actions/checkout@v3
      - name: � Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: 📦 Install Python deps
        run: |
          python -m pip install --upgrade pip
          make deps
      - name:  Node install (if package.json present)
        if: ${{ hashFiles('package.json') != '' }}
        run: npm install
      - name: 🧹 Python Lint
        run: make py-lint
      - name: 🧪 Python Tests
        run: make py-test
      - name: 🛡️ Vulnerability Scan (pip-audit)
        run: make vuln-scan
      - name: 📊 Coverage Report
        run: make coverage
      - name: 📤 Upload coverage artifact
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: |
            .coverage
            htmlcov/
      - name: � Audit (dry-run)
        run: make audit-dry || true
      - name: 📄 Generate summary
        run: make audit-summary || true
      - name: 📤 Upload repo summary artifact
        uses: actions/upload-artifact@v3
        with:
          name: enterprise-file-summary
          path: ENTERPRISE_FILE_SUMMARY.md
      - name: �🐶 Node Lint
        if: ${{ hashFiles('package.json') != '' }}
        run: make lint || true
      - name: 🐶 Node Tests
        if: ${{ hashFiles('package.json') != '' }}
        run: make test || true
