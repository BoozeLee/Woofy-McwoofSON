name: "Woofy: Lint & Test 🐶"
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: 🐶 Checkout code
        uses: actions/checkout@v4
      - name: 🐶 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 📦 Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 🧹 Python Lint (ruff)
        run: ruff check integrations main.py tests scripts
      - name: 🧪 Python Tests
        run: pytest --tb=short
      - name: 📊 Coverage
        run: pytest --cov=integrations --cov-report=term-missing --cov-fail-under=70
