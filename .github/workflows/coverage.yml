name: Coverage

on:
  pull_request:
  push:
    branches: [ main, develop ]

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov==5.0.0 coverage==7.6.1

      - name: Run tests with coverage (src/enterprise only)
        env:
          PYTEST_ADDOPTS: "-q"
        run: |
          pytest --cov=src/enterprise --cov-config=.coveragerc --cov-report=xml --cov-report=html --cov-report=term-missing
          # Ensure coverage.xml exists at root for upload/comment parsing

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
          verbose: false

      - name: Coverage summary comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('coverage.xml')) {
              core.warning('coverage.xml not found, skipping summary comment.');
              return;
            }
            const xml = fs.readFileSync('coverage.xml', 'utf8');
            const lines = (xml.match(/lines-covered="(\d+)" lines-valid="(\d+)"/) || []);
            if (lines.length === 3) {
              const covered = parseInt(lines[1],10); const total = parseInt(lines[2],10);
              const pct = (covered/total*100).toFixed(2);
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `🦴 Coverage: **${pct}%** (${covered}/${total} lines)`
              });
            } else {
              console.log('Could not parse coverage.xml for summary.');
            }

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage_html
