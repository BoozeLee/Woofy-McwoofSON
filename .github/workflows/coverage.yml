name: Coverage

on:
  pull_request:
  push:
    branches: [ main, develop ]

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest --cov=integrations --cov-report=xml --cov-report=term-missing --cov-fail-under=85

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true
          verbose: false

      - name: Coverage summary comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const xml = fs.readFileSync('coverage.xml', 'utf8');
            const lines = (xml.match(/lines-covered="(\d+)" lines-valid="(\d+)"/) || []);
            if (lines.length === 3) {
              const covered = parseInt(lines[1],10); const total = parseInt(lines[2],10);
              const pct = (covered/total*100).toFixed(2);
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `🦴 Coverage: **${pct}%** (${covered}/${total} lines)`
              });
            } else {
              console.log('Could not parse coverage.xml for summary.');
            }
