name: Overlook Buster Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: flake8 .
      - name: Format Check
        run: black --check .
      - name: Test
        run: pytest
      - name: Security Scan
        uses: github/codeql-action/init@v3
        with:
          languages: python,javascript
      - name: CodeQL Analyze
        uses: github/codeql-action/analyze@v3